name: Update videos

# Every hour, refresh the saved copy of the latest YouTube videos.
# A change is committed to main, which redeploys the site.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch latest videos
        run: node scripts/update-videos.ts
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/content/videos.ts; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/videos.ts
          git commit -m "Update latest videos"
          git push
